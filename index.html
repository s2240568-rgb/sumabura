<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pikachu vs Mewtwo Smash</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        canvas {
            background: linear-gradient(to bottom, #1e3a8a, #3b82f6);
            border: 4px solid #fff;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
        #ui {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 50px;
            z-index: 10;
        }
        .info-card {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 30px;
            border-radius: 10px;
            border: 2px solid #fff;
            text-align: center;
            min-width: 150px;
        }
        .name { color: #fff; font-size: 14px; margin-bottom: 5px; }
        .percent { color: #ff4d4d; font-size: 32px; font-weight: bold; }
        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="controls">
        [プレイヤー: ピカチュウ]<br>
        移動: 矢印キー<br>
        ジャンプ: ↑ (2回可能)<br>
        電撃: Z / スマッシュ: X<br>
        でんこうせっか: C / かみなり: V
    </div>

    <div id="ui">
        <div class="info-card" id="p1-card">
            <div class="name">PIKACHU (YOU)</div>
            <div id="p1-percent" class="percent">0%</div>
        </div>
        <div class="info-card" id="p2-card">
            <div class="name">MEWTWO (AI)</div>
            <div id="p2-percent" class="percent">0%</div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Constants
        const GRAVITY = 0.35; // Mewtwo is floaty, adjusted overall
        const FRICTION = 0.88;
        const STAGE_X = 150;
        const STAGE_Y = 400;
        const STAGE_WIDTH = 500;
        const STAGE_HEIGHT = 20;

        // Game State
        const keys = {};
        let projectiles = [];

        class Character {
            constructor(x, y, color, type) {
                this.x = x;
                this.y = y;
                this.width = 40;
                this.height = (type === 'mewtwo') ? 50 : 40;
                this.color = color;
                this.type = type;
                this.isPlayer = (type === 'pikachu');
                
                this.velX = 0;
                this.velY = 0;
                this.percent = 0;
                this.jumps = 0;
                this.maxJumps = (type === 'mewtwo') ? 2 : 2;
                this.grounded = false;
                this.dir = this.isPlayer ? 1 : -1;
                this.isAttacking = 0;
                this.specialEffect = null;
                
                // Floating logic for Mewtwo
                this.floatTimer = 0;
            }

            update() {
                // Gravity (Mewtwo falls slower)
                const gravityScale = (this.type === 'mewtwo') ? 0.7 : 1;
                this.velY += GRAVITY * gravityScale;
                
                this.velX *= FRICTION;
                this.x += this.velX;
                this.y += this.velY;

                this.grounded = false;
                if (this.velY >= 0 && 
                    this.x + this.width > STAGE_X && 
                    this.x < STAGE_X + STAGE_WIDTH &&
                    this.y + this.height >= STAGE_Y && 
                    this.y + this.height <= STAGE_Y + STAGE_HEIGHT + 10) {
                    
                    this.y = STAGE_Y - this.height;
                    this.velY = 0;
                    this.grounded = true;
                    this.jumps = 0;
                }

                if (this.isAttacking > 0) {
                    this.isAttacking--;
                    if (this.isAttacking === 0) this.specialEffect = null;
                }

                // Blast Zones
                if (this.x < -300 || this.x > canvas.width + 300 || this.y < -300 || this.y > canvas.height + 300) {
                    this.respawn();
                }

                // AI Logic (Mewtwo)
                if (!this.isPlayer) {
                    this.updateAI();
                }
            }

            updateAI() {
                // Mewtwo AI behavior
                if (this.x < p1.x - 100) { this.velX += 0.4; this.dir = 1; }
                else if (this.x > p1.x + 100) { this.velX -= 0.4; this.dir = -1; }

                if (this.grounded && Math.random() < 0.01) this.jump();
                
                // Shadow Ball (Projectiles)
                if (Math.random() < 0.01) this.attack();
                
                // Teleport/Confusion (Special)
                if (Math.abs(p1.x - this.x) < 80 && Math.random() < 0.03) {
                    this.smash(); // Using smash as 'Psychic Burst'
                }
            }

            jump() {
                if (this.jumps < this.maxJumps) {
                    this.velY = (this.type === 'mewtwo') ? -9 : -10;
                    this.jumps++;
                    this.grounded = false;
                }
            }

            attack() {
                if (this.isAttacking > 0) return;
                this.isAttacking = 25;
                
                if (this.type === 'pikachu') {
                    // Thunder Jolt
                    projectiles.push({
                        x: this.dir === 1 ? this.x + this.width : this.x - 20,
                        y: this.y + 15,
                        velX: this.dir * 8,
                        owner: this,
                        life: 60,
                        type: 'bolt'
                    });
                } else {
                    // Shadow Ball
                    projectiles.push({
                        x: this.dir === 1 ? this.x + this.width : this.x - 30,
                        y: this.y + 10,
                        velX: this.dir * 5,
                        owner: this,
                        life: 100,
                        type: 'shadow_ball'
                    });
                }
            }

            smash() {
                if (this.isAttacking > 0) return;
                this.isAttacking = 30;
                this.specialEffect = 'smash';
                
                if (this.type === 'pikachu') {
                    checkHit(this, 80, 18, this.dir * 15, -7); 
                } else {
                    // Mewtwo Psychic Blast
                    checkHit(this, 100, 20, this.dir * 18, -4);
                }
            }

            // Special move for Player (Pikachu)
            quickAttack() {
                if (this.type !== 'pikachu' || this.isAttacking > 0) return;
                this.isAttacking = 15;
                this.specialEffect = 'quick';
                this.velY = -12;
                this.velX = this.dir * 12;
                checkHit(this, 50, 5, this.dir * 6, -4);
            }

            thunder() {
                if (this.type !== 'pikachu' || this.isAttacking > 10) return; 
                this.isAttacking = 35;
                this.specialEffect = 'thunder';
                
                projectiles.push({
                    x: this.x + this.width / 2 - 15,
                    y: -100,
                    width: 30,
                    height: 0, 
                    velX: 0,
                    velY: 25,
                    owner: this,
                    life: 20,
                    type: 'thunder_pillar'
                });
            }

            takeDamage(damage, launchX, launchY) {
                this.percent += damage;
                const multiplier = (this.percent / 100) + 1;
                this.velX = launchX * multiplier;
                this.velY = launchY * multiplier;
                updateUI();
            }

            respawn() {
                this.x = this.isPlayer ? 200 : 550;
                this.y = 200;
                this.velX = 0;
                this.velY = 0;
                this.percent = 0;
                updateUI();
            }

            draw() {
                ctx.save();
                
                if (this.type === 'pikachu') {
                    this.drawPikachu();
                } else {
                    this.drawMewtwo();
                }

                // Attack Visuals
                if (this.specialEffect === 'smash') {
                    ctx.strokeStyle = (this.type === 'pikachu') ? "#ffff00" : "#a855f7";
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.arc(this.x + this.width/2, this.y + this.height/2, 50, 0, Math.PI*2);
                    ctx.stroke();
                }

                ctx.restore();
            }

            drawPikachu() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                // Ears & Details
                ctx.fillRect(this.x, this.y - 15, 10, 20);
                ctx.fillRect(this.x + this.width - 10, this.y - 15, 10, 20);
                ctx.fillStyle = "#ff0000";
                let cheekX = this.dir === 1 ? this.x + 28 : this.x + 2;
                ctx.beginPath(); ctx.arc(cheekX, this.y + 25, 6, 0, Math.PI * 2); ctx.fill();
            }

            drawMewtwo() {
                // Mewtwo body (Simple representation)
                ctx.fillStyle = this.color;
                // Torso
                ctx.fillRect(this.x + 5, this.y, 30, this.height);
                // Head
                ctx.fillRect(this.x + 10, this.y - 20, 20, 20);
                // Tail
                ctx.fillStyle = "#7c3aed";
                ctx.fillRect(this.x + (this.dir === 1 ? -15 : 35), this.y + 25, 20, 10);
                // Eyes
                ctx.fillStyle = "#fff";
                let eyeX = this.dir === 1 ? this.x + 22 : this.x + 12;
                ctx.fillRect(eyeX, this.y - 15, 4, 4);
                
                // Floating aura
                ctx.strokeStyle = "rgba(168, 85, 247, 0.3)";
                ctx.lineWidth = 2;
                ctx.strokeRect(this.x - 5, this.y - 5, this.width + 10, this.height + 10);
            }
        }

        const p1 = new Character(200, 200, "#ffef00", 'pikachu');
        const p2 = new Character(550, 200, "#e9d5ff", 'mewtwo'); // Light purple for Mewtwo

        function updateUI() {
            document.getElementById('p1-percent').innerText = `${Math.floor(p1.percent)}%`;
            document.getElementById('p2-percent').innerText = `${Math.floor(p2.percent)}%`;
        }

        function checkHit(attacker, range, damage, kX, kY) {
            const targets = [p1, p2].filter(p => p !== attacker);
            targets.forEach(t => {
                const dist = Math.abs((attacker.x + attacker.width/2) - (t.x + t.width/2));
                if (dist < range && Math.abs((attacker.y + attacker.height/2) - (t.y + t.height/2)) < 80) {
                    t.takeDamage(damage, kX, kY);
                }
            });
        }

        function init() {
            canvas.width = 800;
            canvas.height = 600;
            updateUI();
            requestAnimationFrame(gameLoop);
        }

        function update() {
            if (keys[39]) { p1.velX += 0.8; p1.dir = 1; }
            if (keys[37]) { p1.velX -= 0.8; p1.dir = -1; }

            p1.update();
            p2.update();

            projectiles = projectiles.filter(proj => {
                if (proj.type === 'bolt' || proj.type === 'shadow_ball') {
                    proj.x += proj.velX;
                } else if (proj.type === 'thunder_pillar') {
                    proj.height += proj.velY;
                }
                
                proj.life--;

                const targets = [p1, p2].filter(p => p !== proj.owner);
                let hit = false;
                targets.forEach(t => {
                    if (proj.type === 'bolt' || proj.type === 'shadow_ball') {
                        if (proj.x > t.x && proj.x < t.x + t.width && proj.y > t.y && proj.y < t.y + t.height) {
                            const dmg = (proj.type === 'bolt') ? 6 : 9;
                            t.takeDamage(dmg, proj.velX * 0.6, -3);
                            hit = true;
                        }
                    } else if (proj.type === 'thunder_pillar') {
                        if (Math.abs(proj.x + 15 - (t.x + t.width/2)) < 40 && t.y < proj.y + proj.height && t.y + t.height > proj.y) {
                            t.takeDamage(15, 0, 15); 
                            hit = true;
                        }
                    }
                });

                return proj.life > 0 && !hit;
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // BG Decorations
            ctx.fillStyle = "rgba(255,255,255,0.1)";
            ctx.beginPath(); ctx.arc(650, 100, 40, 0, Math.PI*2); ctx.fill();

            // Stage
            ctx.fillStyle = "#111";
            ctx.fillRect(STAGE_X, STAGE_Y, STAGE_WIDTH, STAGE_HEIGHT);
            ctx.fillStyle = "#333";
            ctx.fillRect(STAGE_X, STAGE_Y + STAGE_HEIGHT, STAGE_WIDTH, 120);

            p1.draw();
            p2.draw();

            // Projectiles
            projectiles.forEach(proj => {
                if (proj.type === 'bolt') {
                    ctx.fillStyle = "#ffff00";
                    ctx.beginPath(); ctx.arc(proj.x, proj.y, 7, 0, Math.PI * 2); ctx.fill();
                } else if (proj.type === 'shadow_ball') {
                    ctx.fillStyle = "#a855f7";
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = "#7c3aed";
                    ctx.beginPath(); ctx.arc(proj.x, proj.y, 12, 0, Math.PI * 2); ctx.fill();
                    ctx.shadowBlur = 0;
                } else if (proj.type === 'thunder_pillar') {
                    ctx.fillStyle = "rgba(255, 255, 0, 0.6)";
                    ctx.fillRect(proj.x - 5, proj.y, proj.width + 10, proj.height);
                }
            });
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        window.addEventListener('keydown', e => {
            keys[e.keyCode] = true;
            if (e.keyCode === 38) p1.jump();
            if (e.keyCode === 90) p1.attack();
            if (e.keyCode === 88) p1.smash();
            if (e.keyCode === 67) p1.quickAttack();
            if (e.keyCode === 86) p1.thunder();
        });
        window.addEventListener('keyup', e => keys[e.keyCode] = false);

        init();
    </script>
</body>
</html>
